services :
  postgres : 
    image : postgres:17
    container_name : service_api_postgres

    environment :
      POSTGRES_USER : postgres
      POSTGRES_PASSWORD : postgres
      POSTGRES_DB : service_api

    ports : 
      - 5432:5432

    volumes :
      - postgres:/var/lib/postgresql/data

  redis : 
    image : redis:8
    container_name : service_api_redis
    ports : 
      - 6379:6379  

    volumes : 
      - redis_data:/data  

volumes : 
  postgres : 
  redis_data :